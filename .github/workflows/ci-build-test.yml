name: CI Build and Test

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - '**'

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore SelfEvolvingFramework.slnx

      - name: Build
        run: dotnet build SelfEvolvingFramework.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test SelfEvolvingFramework.slnx --configuration Release --no-build
