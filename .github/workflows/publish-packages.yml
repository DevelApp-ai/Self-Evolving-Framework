name: Package and Publish

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

env:
  NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore SelfEvolvingFramework.slnx

      - name: Build
        run: dotnet build SelfEvolvingFramework.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test SelfEvolvingFramework.slnx --configuration Release --no-build

  package-prerelease:
    if: github.event_name == 'pull_request'
    needs: build-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Compute prerelease version
        run: |
          base_version="$(SEMVER_BUMP=minor bash scripts/compute-next-semver.sh)"
          echo "PACKAGE_VERSION=${base_version}-pr.${{ github.event.pull_request.number }}.${{ github.run_number }}" >> $GITHUB_ENV

      - name: Pack prerelease
        run: dotnet pack src/SelfEvolvingFramework/SelfEvolvingFramework.csproj --configuration Release -p:PackageVersion=${{ env.PACKAGE_VERSION }} -p:GeneratePackageOnBuild=false --output artifacts

      - name: Resolve prerelease package file
        run: |
          shopt -s nullglob
          packages=(artifacts/*.nupkg)
          if [ "${#packages[@]}" -eq 0 ]; then
            echo "No package artifacts were produced for prerelease publishing."
            ls -la artifacts || true
            exit 1
          fi

          for candidate in "${packages[@]}"; do
            if [ "${candidate##*/}" = "package.nupkg" ]; then
              echo "Refusing generic package artifact name: $candidate"
              exit 1
            fi
          done

          if [ "${#packages[@]}" -ne 1 ]; then
            echo "Expected exactly one package artifact but found ${#packages[@]}."
            echo "Produced artifacts:"
            ls -la artifacts || true
            exit 1
          fi

          package_file="${packages[0]}"
          echo "PACKAGE_FILE=$package_file" >> $GITHUB_ENV

      - name: Publish prerelease to GitHub Packages
        run: |
          dotnet nuget add source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
            --name github \
            --username "${{ github.repository_owner }}" \
            --password "${{ secrets.GITHUB_TOKEN }}" \
            --store-password-in-clear-text

          dotnet nuget push "${{ env.PACKAGE_FILE }}" \
            --source github \
            --api-key "${{ secrets.GITHUB_TOKEN }}" \
            --skip-duplicate

      - name: Verify prerelease package download from GitHub Packages
        run: |
          probe_dir="$(mktemp -d /tmp/package-probe-pr-XXXXXX)"
          dotnet new classlib --framework net8.0 --output "$probe_dir" --force
          for attempt in 1 2 3 4 5; do
            if dotnet add "$probe_dir" package DevelApp.SelfEvolvingFramework --version "${{ env.PACKAGE_VERSION }}" --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"; then
              exit 0
            fi

            if [ "$attempt" -eq 5 ]; then
              echo "Package was published but could not be restored from GitHub Packages."
              exit 1
            fi

            sleep 10
          done

  package-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-test
    runs-on: ubuntu-latest
    environment: ${{ vars.RELEASE_ENVIRONMENT || 'production' }}
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Compute release version
        run: echo "PACKAGE_VERSION=$(SEMVER_BUMP=minor bash scripts/compute-next-semver.sh)" >> $GITHUB_ENV

      - name: Pack release
        run: dotnet pack src/SelfEvolvingFramework/SelfEvolvingFramework.csproj --configuration Release -p:PackageVersion=${{ env.PACKAGE_VERSION }} -p:GeneratePackageOnBuild=false --output artifacts

      - name: Resolve release package file
        run: |
          shopt -s nullglob
          packages=(artifacts/*.nupkg)
          if [ "${#packages[@]}" -eq 0 ]; then
            echo "No package artifacts were produced for release publishing."
            ls -la artifacts || true
            exit 1
          fi

          for candidate in "${packages[@]}"; do
            if [ "${candidate##*/}" = "package.nupkg" ]; then
              echo "Refusing generic package artifact name: $candidate"
              exit 1
            fi
          done

          if [ "${#packages[@]}" -ne 1 ]; then
            echo "Expected exactly one package artifact but found ${#packages[@]}."
            echo "Produced artifacts:"
            ls -la artifacts || true
            exit 1
          fi

          package_file="${packages[0]}"
          echo "PACKAGE_FILE=$package_file" >> $GITHUB_ENV

      - name: Publish release to GitHub Packages
        run: |
          dotnet nuget add source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
            --name github \
            --username "${{ github.repository_owner }}" \
            --password "${{ secrets.GITHUB_TOKEN }}" \
            --store-password-in-clear-text

          dotnet nuget push "${{ env.PACKAGE_FILE }}" \
            --source github \
            --api-key "${{ secrets.GITHUB_TOKEN }}" \
            --skip-duplicate

      - name: Verify release package download from GitHub Packages
        run: |
          probe_dir="$(mktemp -d /tmp/package-probe-release-XXXXXX)"
          dotnet new classlib --framework net8.0 --output "$probe_dir" --force
          for attempt in 1 2 3 4 5; do
            if dotnet add "$probe_dir" package DevelApp.SelfEvolvingFramework --version "${{ env.PACKAGE_VERSION }}" --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"; then
              exit 0
            fi

            if [ "$attempt" -eq 5 ]; then
              echo "Package was published but could not be restored from GitHub Packages."
              exit 1
            fi

            sleep 10
          done

      - name: Ensure NuGet.org publishing is configured
        run: |
          if [ -z "${{ env.NUGET_API_KEY }}" ]; then
            echo "::error::NUGET_API_KEY is not configured for the release environment. Add a valid NuGet.org API key with package push permission."
            exit 1
          fi

      - name: Publish release to NuGet.org
        run: dotnet nuget push "${{ env.PACKAGE_FILE }}" --source https://api.nuget.org/v3/index.json --api-key "${{ env.NUGET_API_KEY }}" --skip-duplicate

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.PACKAGE_VERSION }}
          name: v${{ env.PACKAGE_VERSION }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: ${{ env.PACKAGE_FILE }}
